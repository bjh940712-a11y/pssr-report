<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16325c">
<title>현장 촬영 · 기밀시험 결과지</title>
<script src="firebase-config.js"></script>
<style>
:root{--navy:#16325c;--navy-2:#1f4580;--teal:#0f8b8d;--teal-soft:#e3f4f4;--bg:#f3f5f8;--line:#dde3ea;--ink:#1b2430;--ink-2:#4a5667;--ink-3:#7b8798;--bad:#c43c3c;--bad-soft:#fbe9e9;--ok:#1d8a4e;--warn:#b7791f;--warn-soft:#fdf3e1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
.hidden{display:none!important}
header{background:var(--navy);color:#fff;padding:14px 16px calc(14px);padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header .t{font-weight:700;font-size:17px;flex:1}
header .t small{display:block;font-weight:400;font-size:12px;color:#aebcd2}
header button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:6px;padding:6px 10px;font-size:13px}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.note{background:var(--teal-soft);color:#0b5f61;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.55;margin-bottom:14px}
.note b{color:var(--navy)}
.shoot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:150px;border-radius:16px;border:0;background:var(--navy);color:#fff;font-size:20px;font-weight:700;box-shadow:0 6px 18px rgba(22,50,92,.25);position:relative;overflow:hidden}
.shoot:active{transform:scale(.99)}
.shoot .ic{font-size:40px;line-height:1}
.shoot input,.alt input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.alt{position:relative;display:block;text-align:center;margin-top:10px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:15px;font-weight:600}
h3{font-size:15px;margin:22px 2px 10px;color:var(--navy);display:flex;align-items:center;gap:8px}
h3 span{font-weight:400;color:var(--ink-3);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
.it img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#eef1f4}
.it .lb{font-weight:700}
.it .st{font-size:13px;color:var(--ink-3)}
.it .st.ok{color:var(--ok)} .it .st.err{color:var(--bad)}
.it button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.empty{text-align:center;color:var(--ink-3);padding:22px;font-size:14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:12px 0 4px}
input[type=email],input[type=password]{width:100%;border:1px solid #c9d2dd;border-radius:8px;padding:12px;font-size:16px;background:#fff}
.btn{width:100%;margin-top:16px;border:0;border-radius:10px;padding:14px;background:var(--navy);color:#fff;font-weight:700;font-size:16px}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #c9d2dd;border-top-color:var(--teal);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-1px;margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="t">기밀시험 결과지 촬영<small>공급전 안전점검 · 현장 사진함</small></div>
  <button id="outBtn" class="hidden">로그아웃</button>
</header>
<main>
  <!-- 설정 없음 -->
  <div id="vCfg" class="card hidden">
    <b>Firebase 설정이 없습니다.</b>
    <p style="color:var(--ink-2);font-size:14px">관리자가 GitHub 저장소의 <code>firebase-config.js</code> 파일에 설정값을 넣어야 사용할 수 있습니다.</p>
  </div>
  <!-- 로그인 -->
  <div id="vLogin" class="card hidden">
    <div style="font-weight:700;font-size:17px;color:var(--navy)">직원 로그인</div>
    <label class="f" for="em">이메일</label><input type="email" id="em" autocomplete="username" inputmode="email">
    <label class="f" for="pw">비밀번호</label><input type="password" id="pw" autocomplete="current-password">
    <button class="btn" id="inBtn">로그인</button>
    <div class="err" id="inErr"></div>
  </div>
  <!-- 촬영 -->
  <div id="vMain" class="hidden">
    <div class="note">📌 <b>기밀시험 결과지만</b> 촬영하세요.<br>이름·주소 등은 입력하지 않습니다. 사진은 사무실 PC에서 해당 건에 연결되며, 서버에서는 <b id="keepDays">3</b>일 뒤 자동 삭제됩니다.</div>
    <label class="shoot"><span class="ic">📷</span>결과지 촬영
      <input type="file" id="cam" accept="image/*" capture="environment"></label>
    <label class="alt">🖼 앨범에서 선택<input type="file" id="pick" accept="image/*" multiple></label>
    <h3>오늘 올린 사진 <span id="cnt"></span></h3>
    <div class="list" id="list"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
/* ===== 현장 사진함 (Firebase) — 기밀시험 결과지 사진만 저장, 식별정보 없음 =====
   fieldPhotos/{id}    : thumb(작은 미리보기), w, h, label("10/23 #3"), by(업로더 uid), createdAt, expireAt
   fieldPhotoData/{id} : data(원본 JPEG base64), by, createdAt, expireAt
   주소·이름·계약번호 등 어떤 식별정보도 저장하지 않습니다. */
const FieldStore = (() => {
  const SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
  const META = 'fieldPhotos', DATA = 'fieldPhotoData';
  const KEEP_DAYS = 3;
  const CFG_KEY = 'pssr.fbconfig';
  let fb = null, auth = null, db = null, initP = null;

  function config(){
    const w = window.FIREBASE_CONFIG;
    if (w && w.apiKey && w.projectId) return w;
    try{ const c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (c && c.apiKey && c.projectId) return c; }catch(e){}
    return null;
  }
  function parseConfig(text){
    // firebaseConfig = { apiKey: "...", ... } 형태도 받아들임
    let t = String(text || '').trim();
    const m = t.match(/\{[\s\S]*\}/); if (!m) throw new Error('설정값에서 { … } 부분을 찾지 못했습니다.');
    t = m[0].replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g, '$1"$2":').replace(/'/g, '"').replace(/,\s*}/g, '}');
    const c = JSON.parse(t);
    if (!c.apiKey || !c.projectId) throw new Error('apiKey 또는 projectId가 없습니다.');
    return c;
  }
  function saveConfig(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }
  function clearConfig(){ try{ localStorage.removeItem(CFG_KEY); }catch(e){} }
  function load(src){ return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('Firebase를 불러오지 못했습니다 (인터넷 연결 확인)')); document.head.appendChild(s); }); }
  function init(){
    return initP ||= (async () => {
      const cfg = config(); if (!cfg) throw new Error('Firebase 설정이 없습니다.');
      if (!window.firebase || !window.firebase.firestore){
        await load(SDK + 'firebase-app-compat.js');
        await Promise.all([load(SDK + 'firebase-auth-compat.js'), load(SDK + 'firebase-firestore-compat.js')]);
      }
      fb = window.firebase;
      const app = fb.apps && fb.apps.length ? fb.app() : fb.initializeApp(cfg);
      auth = fb.auth(); db = fb.firestore();
      return true;
    })().catch(e => { initP = null; throw e; });
  }
  const errMsg = e => {
    const c = (e && e.code) || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-email|invalid-login/.test(c)) return '이메일 또는 비밀번호가 맞지 않습니다.';
    if (/too-many-requests/.test(c)) return '로그인 시도가 너무 많습니다. 잠시 후 다시 시도하세요.';
    if (/network/.test(c)) return '네트워크에 연결할 수 없습니다.';
    if (/permission-denied/.test(c)) return '권한이 없습니다. 관리자에게 사용자 등록(members)을 요청하세요.';
    if (/resource-exhausted/.test(c)) return '오늘 무료 사용량을 초과했습니다. 내일 다시 시도하세요.';
    return (e && e.message) || String(e);
  };
  const ts = d => fb.firestore.Timestamp.fromDate(d);
  const toDate = t => t && t.toDate ? t.toDate() : (t ? new Date(t) : null);
  function expireDate(){ return new Date(Date.now() + KEEP_DAYS * 864e5); }

  return {
    KEEP_DAYS, config, parseConfig, saveConfig, clearConfig, init, errMsg, toDate,
    isConfigured: () => !!config(),
    onAuth(cb){ return auth.onAuthStateChanged(cb); },
    user: () => auth && auth.currentUser,
    signIn: (e, p) => auth.signInWithEmailAndPassword(e, p),
    signOut: () => auth.signOut(),
    async checkMember(){ const u = auth.currentUser; if (!u) return false; try{ const d = await db.collection('members').doc(u.uid).get(); return d.exists; }catch(e){ return false; } },
    async upload({thumb, w, h, label, data}){
      const u = auth.currentUser; if (!u) throw new Error('로그인이 필요합니다.');
      const ref = db.collection(META).doc();
      const now = fb.firestore.FieldValue.serverTimestamp(), exp = ts(expireDate());
      const b = db.batch();
      b.set(ref, {thumb, w, h, label, by: u.uid, createdAt: now, expireAt: exp});
      b.set(db.collection(DATA).doc(ref.id), {data, by: u.uid, createdAt: now, expireAt: exp});
      await b.commit();
      return ref.id;
    },
    watchAll(cb, onErr){
      return db.collection(META).orderBy('createdAt', 'desc').limit(200)
        .onSnapshot(s => cb(s.docs.map(d => ({id: d.id, ...d.data()}))), onErr);
    },
    async listMine(){
      const u = auth.currentUser; if (!u) return [];
      const s = await db.collection(META).where('by', '==', u.uid).get();
      return s.docs.map(d => ({id: d.id, ...d.data()}));
    },
    async getData(id){
      const d = await db.collection(DATA).doc(id).get();
      if (!d.exists) throw new Error('사진 원본이 서버에 없습니다 (이미 삭제되었거나 만료됨).');
      return d.data().data;
    },
    async remove(id){
      const b = db.batch();
      b.delete(db.collection(META).doc(id)); b.delete(db.collection(DATA).doc(id));
      await b.commit();
    },
    async purgeExpired(){
      const now = ts(new Date()); let n = 0;
      for (const col of [META, DATA]){
        const s = await db.collection(col).where('expireAt', '<', now).limit(200).get();
        for (const d of s.docs){ await d.ref.delete(); if (col === META) n++; }
      }
      return n;
    },
  };
})();

/* 이미지 → JPEG base64 (Firestore 문서 1MB 제한 안으로 압축) */
async function photoToJpeg(file, maxSide, maxB64, q0){
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
  let side = Math.min(maxSide, Math.max(bmp.width, bmp.height)), q = q0, out = null, w = 0, h = 0;
  for (let i = 0; i < 12; i++){
    const sc = side / Math.max(bmp.width, bmp.height);
    w = Math.max(1, Math.round(bmp.width * sc)); h = Math.max(1, Math.round(bmp.height * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
    out = c.toDataURL('image/jpeg', q).split(',')[1];
    if (out.length <= maxB64) break;
    if (q > 0.55) q -= 0.08; else side = Math.round(side * 0.85);
  }
  bmp.close && bmp.close();
  if (out.length > maxB64) throw new Error('사진 용량을 줄이지 못했습니다.');
  return {b64: out, w, h};
}
function b64ToBlob(b64, type){ const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type}); }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2200); }
function show(v){ ['vCfg','vLogin','vMain'].forEach(x => $('#'+x).classList.toggle('hidden', x !== v)); $('#outBtn').classList.toggle('hidden', v !== 'vMain'); }
const p2 = n => String(n).padStart(2,'0');
const dayKey = d => `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}`;
const hm = d => d ? `${p2(d.getHours())}:${p2(d.getMinutes())}` : '';

let server = [];          // 서버에 있는 내 오늘 사진
const pending = [];       // 업로드 중/실패
function nextLabel(){
  const now = new Date(), k = 'pssr.field.seq.' + dayKey(now);
  let n = 0; try{ n = +localStorage.getItem(k) || 0; }catch(e){}
  const fromServer = server.reduce((m, p) => { const x = +(String(p.label).split('#')[1] || 0); return Math.max(m, x); }, 0);
  n = Math.max(n, fromServer, pending.length ? Math.max(...pending.map(p => +p.label.split('#')[1])) : 0) + 1;
  try{ localStorage.setItem(k, n); }catch(e){}
  return `${p2(now.getMonth()+1)}/${p2(now.getDate())} #${n}`;
}
function render(){
  const items = [
    ...pending.map(p => ({k:'p', ...p})),
    ...server.slice().sort((a,b) => (FieldStore.toDate(b.createdAt)||new Date()) - (FieldStore.toDate(a.createdAt)||new Date())).map(p => ({k:'s', ...p})),
  ];
  $('#cnt').textContent = server.length ? `${server.length}장` : '';
  $('#list').innerHTML = items.length ? items.map(p => p.k === 'p'
    ? `<div class="it"><img src="data:image/jpeg;base64,${p.thumb||''}" alt=""><div><div class="lb">${esc(p.label)}</div>
        <div class="st ${p.err?'err':''}">${p.err ? '⚠ ' + esc(p.err) : '<span class="spin"></span>올리는 중…'}</div></div>
        ${p.err ? `<button data-retry="${p.tmp}">다시 시도</button>` : '<span></span>'}</div>`
    : `<div class="it"><img src="data:image/jpeg;base64,${p.thumb}" alt=""><div><div class="lb">${esc(p.label)}</div>
        <div class="st ok">✓ 전송 완료 · ${hm(FieldStore.toDate(p.createdAt))}</div></div>
        <button data-del="${esc(p.id)}">삭제</button></div>`).join('')
    : '<div class="empty">아직 올린 사진이 없습니다</div>';
}
async function refresh(){
  try{
    const today = dayKey(new Date());
    server = (await FieldStore.listMine()).filter(p => { const d = FieldStore.toDate(p.createdAt); return !d || dayKey(d) === today; });
  }catch(e){ toast(FieldStore.errMsg(e)); }
  render();
}
async function doUpload(p){
  p.err = ''; render();
  try{
    await FieldStore.upload({thumb:p.thumb, w:p.w, h:p.h, label:p.label, data:p.data});
    pending.splice(pending.indexOf(p), 1);
    toast(`${p.label} 전송 완료`);
    await refresh();
  }catch(e){ p.err = FieldStore.errMsg(e); render(); }
}
async function addFiles(files){
  for (const f of files){
    const label = nextLabel();
    const p = {tmp: Math.random().toString(36).slice(2), label, thumb:'', err:''};
    pending.unshift(p); render();
    try{
      const [full, th] = await Promise.all([photoToJpeg(f, 1800, 950000, 0.82), photoToJpeg(f, 240, 55000, 0.7)]);
      Object.assign(p, {data: full.b64, w: full.w, h: full.h, thumb: th.b64});
    }catch(e){ p.err = '사진을 처리할 수 없습니다'; render(); continue; }
    doUpload(p);
  }
}
$('#cam').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) addFiles(fs); };
$('#pick').onchange = e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) addFiles(fs); };
$('#list').addEventListener('click', async e => {
  const r = e.target.closest('[data-retry]'); if (r){ const p = pending.find(x => x.tmp === r.dataset.retry); if (p) doUpload(p); return; }
  const d = e.target.closest('[data-del]'); if (!d) return;
  if (!confirm('이 사진을 서버에서 삭제할까요?')) return;
  try{ await FieldStore.remove(d.dataset.del); toast('삭제했습니다'); await refresh(); }catch(err){ toast(FieldStore.errMsg(err)); }
});
$('#inBtn').onclick = async () => {
  $('#inErr').textContent = ''; $('#inBtn').disabled = true;
  try{ await FieldStore.signIn($('#em').value.trim(), $('#pw').value); }
  catch(e){ $('#inErr').textContent = FieldStore.errMsg(e); }
  finally{ $('#inBtn').disabled = false; }
};
$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') $('#inBtn').click(); });
$('#outBtn').onclick = () => FieldStore.signOut();
window.addEventListener('beforeunload', e => { if (pending.some(p => !p.err)) { e.preventDefault(); e.returnValue = ''; } });

(async () => {
  $('#keepDays').textContent = FieldStore.KEEP_DAYS;
  if (!FieldStore.isConfigured()) return show('vCfg');
  try{ await FieldStore.init(); }catch(e){ $('#vCfg').innerHTML = `<b>연결 실패</b><p>${esc(FieldStore.errMsg(e))}</p>`; return show('vCfg'); }
  FieldStore.onAuth(async u => {
    if (!u) return show('vLogin');
    if (!(await FieldStore.checkMember())){ show('vLogin'); $('#inErr').textContent = '등록되지 않은 사용자입니다. 관리자에게 사용자 등록을 요청하세요.'; FieldStore.signOut(); return; }
    show('vMain'); refresh();
  });
})();
</script>
</body>
</html>
